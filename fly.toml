app = "pulsefeed-rss"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PULSEFEED_EDITION = "enterprise"
  PULSEFEED_HOST = "0.0.0.0"
  PULSEFEED_PORT = "8080"
  PULSEFEED_DB = "/data/pulsefeed.db"
  PULSEFEED_STATIC_DIR = "/app/dist"

[mounts]
  source = "pulsefeed_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
