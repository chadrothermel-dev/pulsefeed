services:
  pulsefeed:
    build: .
    container_name: pulsefeed
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PULSEFEED_HOST=0.0.0.0
      - PULSEFEED_PORT=8080
      - PULSEFEED_DB=/data/pulsefeed.db
      - PULSEFEED_STATIC_DIR=/app/dist
      - PULSEFEED_JWT_SECRET=${PULSEFEED_JWT_SECRET:-change-this-secret-in-production}
      - PULSEFEED_CONCURRENCY=24
      - PULSEFEED_POLL_SECS=300
    volumes:
      - pulsefeed_data:/data

  # Optional: Uncomment to enable automatic Let's Encrypt HTTPS on a VPS
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: pulsefeed-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - pulsefeed

volumes:
  pulsefeed_data:
